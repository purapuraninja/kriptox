# Kriptox config — paper live 24/7 selama 1 bulan.
# Semua limit risiko HARD di code (src/risk.py). Model/policy tidak bisa override.

mode: paper            # paper | live (live dikunci, butuh --i-understand-live-risk)
exchanges:
  - bybit
  - okx
  - bitget
  - gate
  - binance

symbols:
  - BTC/USDT
  - ETH/USDT
  - SOL/USDT

timeframe: 1m          # candle utama; snapshot tiap block
poll_seconds: 15       # jeda antar snapshot per symbol (hemat rate-limit)
orderbook_depth: 20    # level orderbook untuk imbalance/microprice

starting_equity_usdt: 10000.0

# ---- Policy gates (Jev-schema equivalent, deterministik) ----
policy:
  min_setup_quality: 2        # fire hanya jika setup_quality >= 2 (0..3)
  min_confidence: 0.80        # fire hanya jika confidence > 0.80
  require_risk_safe: true     # fire hanya jika risk_state == safe
  escalate_confidence: 0.60   # di bawah ini -> escalate ke review/BRAIN (no trade)
  crisis_action: halt         # jika regime == crisis -> halt (no new position)

# ---- Sizing: fractional Kelly, capped quarter-Kelly ----
sizing:
  kelly_fraction: 0.5         # half-Kelly
  max_kelly_cap: 0.25         # cap quarter-Kelly: size tidak pernah > 25% equity per posisi
  max_position_pct: 0.20      # cap tambahan: notional per symbol <= 20% equity
  max_total_exposure_pct: 0.60
  max_leverage: 1.0           # paper spot 1x. Jangan >1 tanpa paham likuidasi.
  min_edge_bps: 5.0           # edge estimasi harus > biaya + slippage
  taker_fee_bps: 5.0          # default jika exchange tidak lapor fee
  slippage_bps: 3.0

# ---- Risk HARD LIMITS ----
risk:
  max_drawdown_pct: 15.0      # kill switch: equity dari peak turun >=15% -> HALT total
  max_daily_loss_pct: 3.0     # per hari UTC: loss >=3% -> stop hari itu
  max_position_pct: 0.20
  max_total_exposure_pct: 0.60
  cooldown_after_stop_seconds: 3600
  kill_switch_file: state/kill_switch.armed  # buat file ini untuk HALT manual

# ---- Regime thresholds (terdokumentasi di src/regime.py) ----
regime:
  adx_trend_min: 22.0
  ema_atr_trend_min: 0.35
  high_vol_percentile: 0.80
  high_vol_lookback: 2880      # ~48 jam pada 1m
  crisis_drawdown_pct: 8.0
  crisis_spread_bps: 40.0
  funding_extreme: 0.0005      # 5 bps per funding interval = extreme

# ---- Review malam (Brier score + kalibrasi) ----
review:
  log_dir: state/logs
  brier_warn: 0.25             # Brier > 0.25 = kalibrasi buruk, naikkan min_confidence
  min_trades_for_recalib: 20

data:
  state_dir: state
  use_testnet: false
